    <!-- =================================================
         MOBILE SIDEBAR
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const menuBtn =
                    document.getElementById(
                        "mobileMenuBtn"
                    );

                const sidebar =
                    document.getElementById(
                        "sidebar"
                    );

                const overlay =
                    document.getElementById(
                        "sidebarOverlay"
                    );


                function openSidebar() {

                    if (sidebar) {

                        sidebar.classList.add(
                            "mobile-open"
                        );
                    }

                    if (overlay) {

                        overlay.classList.add(
                            "show"
                        );
                    }

                    document.body.classList.add(
                        "sidebar-open"
                    );
                }


                function closeSidebar() {

                    if (sidebar) {

                        sidebar.classList.remove(
                            "mobile-open"
                        );
                    }

                    if (overlay) {

                        overlay.classList.remove(
                            "show"
                        );
                    }

                    document.body.classList.remove(
                        "sidebar-open"
                    );
                }


                if (menuBtn) {

                    menuBtn.addEventListener(
                        "click",
                        function () {

                            if (
                                sidebar &&
                                sidebar.classList.contains(
                                    "mobile-open"
                                )
                            ) {

                                closeSidebar();

                            } else {

                                openSidebar();

                            }

                        }
                    );

                }


                if (overlay) {

                    overlay.addEventListener(
                        "click",
                        closeSidebar
                    );

                }


                if (sidebar) {

                    sidebar
                        .querySelectorAll("a")
                        .forEach(
                            function (link) {

                                link.addEventListener(
                                    "click",
                                    closeSidebar
                                );

                            }
                        );

                }

            }
        );

    </script>

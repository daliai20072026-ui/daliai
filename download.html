<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dali AI - Download</title>

    <link rel="shortcut icon" href="logo.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #0D1117;
            color: #F0F6FC;
            font-family: "Inter", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;

            background-color: #161B22;
            border: 1px solid #30363D;
            border-radius: 30px;

            padding: 60px 40px;

            transition: 0.3s ease;
        }

        .container:hover {
            border-color: #00E5FF;
            transform: translateY(-5px);
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        h1 span {
            color: #00E5FF;
        }

        p {
            color: #8B949E;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .status {
            color: #7EE787;
            font-size: 20px;
            font-weight: 600;
            margin: 30px 0;
        }

        .back {
            display: inline-block;
            text-decoration: none;
            color: #0D1117;
            background-color: #00E5FF;

            padding: 12px 25px;
            border-radius: 20px;

            font-size: 17px;
            font-weight: 600;

            transition: 0.3s ease;
        }

        .back:hover {
            background-color: #7EE787;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {

            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 35px;
            }

            p {
                font-size: 16px;
            }

            .logo {
                width: 65px;
                height: 65px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img src="./logo.png" alt="Dali AI Logo" class="logo">

        <h1>
            Dali <span>AI</span>
        </h1>

        <p class="status">
            🚧 Coming Soon
        </p>

        <p>
            The Dali AI desktop app is currently under development.
        </p>

        <p>
            We're working on making it faster, smarter, and easier to use.
        </p>

        <p>
            The application will be available for download soon.
        </p>

        <a href="index.html" class="back">
            Back to Home
        </a>

    </main>

</body>

</html>
